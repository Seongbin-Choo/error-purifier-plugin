grounding.crossTenantCache=서로 다른 테넌트가 같은 캐시 결과를 참조한 로그에서는 캐시 키 격리가 1차 의심입니다. carrier thread 이름만으로 ThreadLocal 오염을 원인으로 단정할 수 없습니다.
guidance.buildWrapperOnly=현재 콘솔에는 Gradle 실행 실패 요약만 있고 애플리케이션 예외가 없습니다. Run 콘솔을 위로 올려 첫 `Exception in thread`, `ERROR`, 또는 `Caused by:` 줄부터 아래 스택트레이스까지 선택해 다시 실행하세요. Gradle 자체 설정 오류가 의심되면 실행 명령에 `--stacktrace`를 추가하세요.
guidance.noActionableLog=정제 후 분석할 로그가 남아 있지 않습니다. 예외 메시지와 스택트레이스가 포함된 구간을 선택하세요.
