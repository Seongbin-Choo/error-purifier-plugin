consent.message=AI Error Purifier는 분석 실행, 제공자 연결 테스트, 사용량 조회 또는 피드백 제출 시 다음 데이터를 전송할 수 있습니다.\n\n- 선택한 콘솔 텍스트 또는 선택 영역이 없을 때 전체 콘솔 로그와 필터링된 프로젝트 메타데이터를 사용자가 설정한 셀프호스팅 Error Purifier 백엔드로 보내 최선 노력 방식의 마스킹과 압축을 수행합니다. 100,000자를 초과하는 로그는 거부합니다.\n- 준비된 프롬프트와 분석 모드 지시문을 IDE에서 사용자가 선택한 LLM 제공자로 직접 전송합니다.\n- 영구 장치 UUID와 사용량 또는 피드백 메타데이터를 설정된 백엔드로 전송합니다.\n- 제공자 API 키는 IntelliJ PasswordSafe에 저장되며 선택한 제공자에게만 전송되고 Error Purifier 백엔드에는 전송되지 않습니다.\n- 선택적 연결 테스트는 콘솔 로그 없이 설정된 모델과 API 키만 선택한 제공자에게 전송합니다.\n\n개인정보 처리방침:\n{0}\n\n이러한 데이터 전송에 동의하시겠습니까?
