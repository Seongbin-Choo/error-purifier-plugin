consent.message=AI Error Purifier can send data when you run an analysis, test a provider connection, load usage totals, or submit feedback:\n\n- Selected console text, or the full console log when nothing is selected, plus filtered project metadata, is sent to your configured self-hosted Error Purifier backend for best-effort masking and compression. Log payloads over 100,000 characters are rejected.\n- The prepared prompt and analysis-mode instruction are sent directly from the IDE to your selected LLM provider.\n- A persistent device UUID and usage or feedback metadata are sent to the configured backend.\n- Your provider API key is stored in IntelliJ PasswordSafe and is sent to the selected provider, not to the Error Purifier backend.\n- The optional connection test sends the configured model and API key to the selected provider without sending console-log content.\n\nPrivacy Policy:\n{0}\n\nDo you consent to these data transfers?
